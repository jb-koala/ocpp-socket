; Firmware OCPP Socket — ESP32-S3, framework Arduino + MicroOcpp (decisions/0008).
;   pio test -e native        -> tests Unity en laptop (solo lib/, sin hardware)
;   pio run  -e esp32s3       -> build del firmware de campo (src/)
;   pio run  -e esp32s3 -t upload  (bloqueado por hook salvo OCPP_ALLOW_FLASH=1)
[platformio]
default_envs = native
extra_configs = platformio.local.ini   ; opcional, NO versionado: OTA_HTTP_PASS, puerto, etc.

[env]
build_flags =
    -Wall
extra_scripts = pre:scripts/git_version.py

; Escalón 1: laptop. Solo lib/ (lógica pura).
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -DNATIVE_BUILD

; Escalón 2/3: devkit ESP32-S3 N16R8 y placa real.
; Equivale a la config que se usaba en Arduino IDE: default_8MB (dos particiones OTA), ver docs/lecciones.md L-007.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = default_8MB.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi     ; N16R8: PSRAM octal
board_upload.flash_size = 16MB
monitor_speed = 115200
test_framework = unity
lib_deps =
    ; El firmware de campo usa una API que no está en la 1.2.0 publicada (mocpp_initialize con
    ; firmwareVersion, setOnUnlockConnectorInOut). A confirmar la versión exacta instalada en el
    ; Arduino IDE de JB y pinear a ese commit/tag.
    https://github.com/matth-x/MicroOcpp.git
    adafruit/Adafruit NeoPixel@^1.12
    olikraus/U8g2@^2.35
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMO_ENABLE_CONNECTOR_LOCK=1      ; habilita setOnUnlockConnectorInOut en MicroOcpp
    -DBOARD_DEVKIT_PROTO              ; placa: ver src/board/board.h

; Placa propia FLUXIO-PCB-01. Falla a propósito hasta completar hw/mainboard-revA/pinout.md.
[env:pcb01]
extends = env:esp32s3
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMO_ENABLE_CONNECTOR_LOCK=1
    -DBOARD_FLUXIO_PCB01
