; Firmware OCPP Socket.
;   pio test -e native        -> tests Unity en laptop (sin placa)
;   pio run  -e esp32s3       -> build ESP-IDF
;   pio run  -e esp32s3 -t upload  (bloqueado por hook salvo OCPP_ALLOW_FLASH=1)
[platformio]
default_envs = native

[env]
build_flags =
    -Wall -Wextra
    -I lib/session_guard
extra_scripts = pre:scripts/git_version.py

; Escalón 1: laptop. Solo lib/ (lógica pura), sin ESP-IDF.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -DNATIVE_BUILD

; Escalón 3: placa real.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_ota.csv
build_flags =
    ${env.build_flags}
test_framework = unity
