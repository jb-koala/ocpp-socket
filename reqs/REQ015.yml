text: |
  Con 10 A continuos hasta estabilización térmica (≥ 1 h), la elevación de temperatura en los bornes del tomacorriente, en TB1 y en los contactos de K1 no debe superar 45 K sobre ambiente (IEC 60884-1 §19). El corte por temperatura (REQ004) no debe actuar durante este ensayo.
