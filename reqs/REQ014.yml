text: |
  El diseño debe poder certificarse bajo esquema CB (IECEE) con un laboratorio reconocido, y registrarse en Argentina bajo el Reglamento Técnico de Seguridad Eléctrica (Res. SIyC 16/2025, vigencia 2 años) y en ENACOM/RAMATEL (Res. 57/2026) para el módulo Wi-Fi. La clasificación de producto (tomacorriente controlado IEC 60884-1 + IEC 60669-2-1, o EVSE IEC 61851-1) se confirma por escrito en la consulta de alcance antes del ensayo formal. El manual de instalación debe referir a AEA 90364-7-722:2024.
