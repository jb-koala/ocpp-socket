text: |
  La tapa debe trabarse al iniciar la sesión y un sensor debe confirmar el estado de la traba antes de cerrar el relé. La traba debe liberarse automáticamente si el socket pierde alimentación, y debe existir una liberación manual de emergencia accesible para el instalador.
