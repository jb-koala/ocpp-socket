text: |
  El socket debe operar con entrada de 100-240 V AC 50/60 Hz y entregar 10 A continuos en la toma (variante de 20 A sobre el mismo hardware, con toma y cableado acordes). Debe incluir fusible, varistor y filtro de modo común en la entrada.
