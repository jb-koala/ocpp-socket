text: |
  La barrera entre los circuitos de red y los circuitos SELV (MCU, medición, expansión, USB) debe ser reforzada para 250 V: creepage ≥ 6.4 mm, clearance ≥ 3 mm, y soportar 3 kV AC durante 1 min sin descarga; red↔PE 1.5 kV AC. Resistencia de aislación ≥ 5 MΩ a 500 V DC. Continuidad PE entrada→toma ≤ 0.1 Ω.
