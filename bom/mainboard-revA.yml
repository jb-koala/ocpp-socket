# BOM de mainboard rev A. Una entrada por parte distinta.
# Campos obligatorios: ref, part, qty, order_code (JLCPCB "Cxxxxx" u otro proveedor), mass, cost, power_idle.
# tests/test_bom.py falla si falta un campo; tests/test_budgets.py suma mass/cost/power_idle contra reqs/budgets.yml.
# Los valores iniciales son estimaciones; se reemplazan por los reales cuando el esquemático esté cerrado.

board: mainboard-revA
currency: USD
quantity_basis: 100   # los costos unitarios son a esta cantidad

parts:
  - ref: U1
    part: ESP32-S3-WROOM-1-N8R2
    qty: 1
    supplier: JLCPCB
    order_code: C2913205
    mass: "3.5 g"
    cost: "3.20 USD"
    power_idle: "0.6 W"
    note: "Wi-Fi conectado, modem sleep"

  - ref: PS1
    part: "Fuente AC/DC 220 V → 5 V 2 A (módulo)"
    qty: 1
    supplier: JLCPCB
    order_code: TBD
    mass: "25 g"
    cost: "4.50 USD"
    power_idle: "0.5 W"
    note: "pérdidas en vacío"

  - ref: K1
    part: "Relé 16 A 250 VAC, bobina 5 V"
    qty: 1
