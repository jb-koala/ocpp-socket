name: check
on: [push, pull_request]

jobs:
  project-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyyaml pint
      - run: make limits
      - run: make test

  firmware-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio pyyaml pint
      - run: make fw-test

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio pyyaml pint
      - run: make limits
      - run: cd firmware && pio run -e esp32s3
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: firmware/.pio/build/esp32s3/firmware.bin

  hardware-check:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq make >/dev/null
      - run: make hw-check
